# ==============================================================================
# ORÁCULO SPN - CONFIGURAÇÃO MODULAR NGINX (INTRANET / PRODUÇÃO)
# ==============================================================================
# Instruções de Uso:
# 1. Copie este arquivo para `/etc/nginx/conf.d/oraculo.conf` 
#    (ou `/etc/nginx/sites-available/oraculo.conf` e crie o link simbólico para `sites-enabled`).
# 2. Escolha a opção de roteamento desejada (Subdomínio/Domain Name ou Porta Diferente).
# 3. Recarregue o Nginx: `sudo nginx -t && sudo systemctl reload nginx`
# ==============================================================================

server {
    # --------------------------------------------------------------------------
    # OPÇÃO 1: Subdomínio / Nome DNS Interno (Recomendado)
    # Ex: http://oraculo.intranet.local
    # --------------------------------------------------------------------------
    listen 80;
    server_name oraculo.intranet.local oraculo.suaempresa.corp;

    # --------------------------------------------------------------------------
    # OPÇÃO 2: Caso prefira rodar em uma porta diferente no mesmo IP (Ex: :8080)
    # Descomente a linha abaixo e comente o listen 80 / server_name acima:
    # listen 8080;
    # server_name _;
    # --------------------------------------------------------------------------

    # Diretório dos arquivos estáticos compilados do Frontend (dist do @oraculo/web)
    root /var/www/oraculo_ia/apps/web/dist;
    index index.html;

    # Limite máximo de upload para suporte a anexos (PDF/Word/Imagens)
    client_max_body_size 50M;

    # Headers de Segurança HTTP Básicos (Hardening para Intranet)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression para alta performance de carregamento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # --------------------------------------------------------------------------
    # FRONTEND SPA (Single Page Application Fallback)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo apenas para assets estáticos imutáveis (js, css, imagens)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # ROTA DE STREAMING SSE (Server-Sent Events) - CHAT GENERATE
    # CRÍTICO: Desabilita buffering para o streaming da IA fluir em tempo real!
    # --------------------------------------------------------------------------
    location /api/chat/generate {
        proxy_pass http://127.0.0.1:3333/api/chat/generate;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Desabilita o buffering de resposta no Nginx para o SSE funcionar sem pausas
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Timeouts estendidos para respostas longas de IA (Raciocínio / CoT)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --------------------------------------------------------------------------
    # BACKEND API FASTIFY (Demais endpoints REST e JSON)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3333/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSockets (se habilitado no Fastify)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Log de acesso e erros isolados para o Oráculo SPN
    access_log /var/log/nginx/oraculo_access.log;
    error_log /var/log/nginx/oraculo_error.log;
}
